name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-08-02 --profile minimal --component rust-src --component rustfmt --component clippy --target wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-wasm/Cargo.toml --all -- --check
          cargo fmt --manifest-path tools/data-extractor/Cargo.toml --all -- --check

      - name: Run Rust Clippy
        run: |
          cargo clippy --manifest-path src-wasm/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path tools/data-extractor/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: |
          cargo test --manifest-path src-wasm/Cargo.toml --all-features
          cargo test --manifest-path tools/data-extractor/Cargo.toml --all-features

      - name: Run TypeScript checks and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        env:
          VITE_BASE_PATH: /
        run: npm run test:e2e

      - name: Build exact-source production artifact
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_SOURCE_REVISION: ${{ github.sha }}
        run: npm run build

      - name: Verify corresponding-source metadata
        run: |
          grep -R -F -q "${{ github.server_url }}/${{ github.repository }}" dist/assets
          grep -R -F -q "${{ github.sha }}" dist/assets

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
